services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loc-api
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_TTL_MINUTES=${CACHE_TTL_MINUTES:-60}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-*}
      - HTTP_READ_TIMEOUT_SECONDS=${HTTP_READ_TIMEOUT_SECONDS:-600}
      - HTTP_WRITE_TIMEOUT_SECONDS=${HTTP_WRITE_TIMEOUT_SECONDS:-900}
      - HTTP_IDLE_TIMEOUT_SECONDS=${HTTP_IDLE_TIMEOUT_SECONDS:-300}
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      # Mount /tmp to persist or better manage temporary clones
      - loc_api_tmp:/tmp

  redis:
    image: redis:alpine
    container_name: loc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  loc_api_tmp:
    driver: local
  redis_data:
    driver: local
